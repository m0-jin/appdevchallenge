name: CrewMate Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'CrewMate/android-app/**'
      - 'CrewMate/server/**'
      - 'CrewMate/tests/**'
      - '.github/workflows/crewmate-android.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android API 34 (runner preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test companion server
        working-directory: CrewMate/server
        run: npm test
      - name: Build Android release APK
        working-directory: CrewMate/android-app
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon wrapper --gradle-version 8.10.2
      - name: Sign installable DEMO release APK
        run: |
          set -euo pipefail
          mkdir -p CrewMate/apk
          keytool -genkeypair -v -keystore /tmp/crewmate-demo.jks -storepass demochange123 -keypass demochange123 -alias demo -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=CrewMate Demo, OU=Contest, O=CrewMate, C=KR'
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 CrewMate/android-app/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/crewmate-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks /tmp/crewmate-demo.jks --ks-key-alias demo --ks-pass pass:demochange123 --key-pass pass:demochange123 --out CrewMate/apk/CrewMate_CrewMate_release.apk /tmp/crewmate-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose CrewMate/apk/CrewMate_CrewMate_release.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrewMate-release-demo-apk
          path: CrewMate/apk/CrewMate_CrewMate_release.apk
          if-no-files-found: error
      - name: Commit APK and Gradle wrapper to repository
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CrewMate/apk/CrewMate_CrewMate_release.apk CrewMate/android-app/gradlew CrewMate/android-app/gradlew.bat CrewMate/android-app/gradle/wrapper/gradle-wrapper.jar CrewMate/android-app/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish signed CrewMate demo APK and Gradle wrapper'
            git push origin HEAD:main
          fi
