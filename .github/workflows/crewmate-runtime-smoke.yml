name: CrewMate Android Runtime Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crewmate-runtime-smoke.yml'
permissions:
  contents: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and built APK
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch CrewMate on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb devices
            adb install -r CrewMate/apk/CrewMate_CrewMate_release.apk
            adb shell am start -W -n io.crewmate.app/.MainActivity
            sleep 5
            adb shell pidof io.crewmate.app | grep -Eq '[0-9]+' || { echo "FAIL: MainActivity app process exited"; adb logcat -d -t 1500; exit 1; }
            adb shell dumpsys activity activities | grep -F 'io.crewmate.app' || { echo 'FAIL: CrewMate not in activities'; exit 1; }
            mkdir -p runtime-screenshots
            adb exec-out screencap -p > runtime-screenshots/main.png
            adb shell uiautomator dump /sdcard/crewmate-ui.xml >/dev/null
            adb pull /sdcard/crewmate-ui.xml runtime-screenshots/ui.xml >/dev/null
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('runtime-screenshots/ui.xml').getroot()
            nodes=[n for n in root.iter('node') if '디자인 시안' in n.attrib.get('text','')]
            if not nodes:
                raise SystemExit('FAIL: Preview button not found in MainActivity UI')
            b=nodes[0].attrib['bounds']
            x1,y1,x2,y2=map(int,re.findall(r'\\d+',b))
            subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
            print('Clicked in-app Preview button at',((x1+x2)//2,(y1+y2)//2))
            PY
            sleep 6
            adb shell pidof io.crewmate.app | grep -Eq '[0-9]+' || { echo 'FAIL: PreviewActivity app process exited'; adb logcat -d -t 1500; exit 1; }
            adb shell dumpsys activity activities | grep -F 'io.crewmate.app/.PreviewActivity' || { echo 'FAIL: PreviewActivity not displayed'; exit 1; }
            adb exec-out screencap -p > runtime-screenshots/preview.png
            echo 'PASS: MainActivity and PreviewActivity launched and stayed running'
      - name: Save emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrewMate-emulator-screenshots
          path: runtime-screenshots/
          if-no-files-found: warn
